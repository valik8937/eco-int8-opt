[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eco-int8-opt"
version = "0.4.0"
description = "Fully-int8 ECO optimizers: int8 weights, grads and momentum with zero master weights"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "valik8937", email = "valikcobotar@gmail.com" }]
keywords = ["quantization", "int8", "optimizer", "training", "pytorch", "ECO"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest"]
gpu = ["triton"]

[project.urls]
Homepage = "https://github.com/valik8937/eco-int8-opt"
Repository = "https://github.com/valik8937/eco-int8-opt"

[tool.setuptools.packages.find]
include = ["ecoint8*"]
